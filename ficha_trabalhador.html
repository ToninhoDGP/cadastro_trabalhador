<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Colaborador</title>
</head>
<body>

    <h2>Cadastro de Colaborador - Lojas Brincos e Companhia</h2>

    <form action="painel_trabalhador.php" method="POST">
        
        <label for="nome1">Nome Completo:</label><br>
        <input type="text" id="nome1" name="nome1" required><br><br>

        <label for="idade2">Idade:</label><br>
        <input type="number" id="idade2" name="idade2" required><br><br>

        <label for="profissao3">Profissão:</label><br>
        <input type="text" id="profissao3" name="profissao3" required><br><br>

        <label for="salario4">Salário Pretendido (R$):</label><br>
        <input type="number" step="0.01" id="salario4" name="salario4" required><br><br>

        <label for="experiencia5">Experiência Anterior:</label><br>
        <textarea id="experiencia5" name="experiencia5" rows="4" cols="40" required></textarea><br><br>

        <button type="submit">Enviar Cadastro</button>

    </form>

</body>
</html>
